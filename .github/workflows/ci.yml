name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Gradle 8.10 cannot run on a newer JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The daemon runs on JDK 17 wherever it is installed (gradle/gradle-daemon-jvm.properties).
      - name: Build and test
        run: ./gradlew build --stacktrace

  # An agent against a real rekuest and takt, started in Docker (src/integrationTest): agent
  # protocol 2 as the server speaks it.
  integration:
    name: Integration (real rekuest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Integration test
        run: ./gradlew integrationTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore
